x-app-environment: &app-environment
  DATABASE_URL: postgres://openlumo:openlumo@postgres:5432/openlumo
  STORAGE_DIRECTORY: /data/assets

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: openlumo
      POSTGRES_PASSWORD: openlumo
      POSTGRES_DB: openlumo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlumo -d openlumo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    working_dir: /app/packages/db
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment: *app-environment
    ports:
      - "3000:3000"
    volumes:
      - assets:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment: *app-environment
    volumes:
      - assets:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  assets:
